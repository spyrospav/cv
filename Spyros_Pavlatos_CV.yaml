    projects:
      - name: 'Dynamic Coalescence for Pay-as-you-go Serverless LLM Inference (under submission)'
        start_date: 2025
        end_date: present
        summary: Building a System for serving large Language Models on commercial serverless platforms. 
        highlights: 
          - Developed a novel coordinator-free coalescing technique that merges requests across instances so that unneeded GPU capacity can be reclaimed as load decreases.
          - Proposed an opportunistic decode KV cache transfer protocol to exploit assymetric KV cache generation (prefill/decode) to overlap data movement with computation. 
      - name: 'Migrating Control Planes to Serverless (ongoing)'
        start_date: 2025
        end_date: present
        summary: Utilizing serverless benefits, like efficient resource usage for bursty workloads and
          automatic scaling, to build control planes for distributed systems.
        highlights: 
          - Designed a semi-automatic migration framework that can convert existing control plane implementations to serverless ones.
          - Applied the framework to migrate the Kubernetes control plane to run completely on AWS Lambda.
          - Achieved 60% and 94% reduction in operating and idle costs respectively, while maintaining similar performance.
      - name: '[λ-trim Debloater](https://github.com/eniac/lambda-trim)'
        start_date: 2024
        end_date: present
        highlights:
          - Designed a debloating algorithm that leverages established dynamic
            analysis techniques and a cost model to optimize serverless applications.
          - Implemented the algorithm in a tool that can be used to debloat Python
            and serverless applications and achieved up to 20% reduction in cold start
            time and cost when deployed on AWS Lambda.
          - Actively maintanining the open-source version of the tool.
        summary: Debloater for Python and serverless applications
      - name: '[MuCache](https://github.com/eniac/mucache)'
        start_date: 2022
        end_date: 2023
        highlights:
          - Implemented various applications to test and evaluate the proposed framework.
          - Verfiied the correctness of the caching framework with a pen-and-paper proof.
        summary: Caching framework for microservices
      - name: '[PM-Benchmarks](https://github.com/spyrospav/pm-benchmarks)'
        start_date: 2021
        end_date: 2022
        highlights:
          - Developed a test suite consisting of litmus tests and complex data structures
            for model checking persistent memory programs under the Px86 memory persistency 
            model.
          - Tested the state-of-the-art model checker [GenMC](https://github.com/MPI-SWS/genmc)
            against the test suite and reported some critical internal bugs in the tool.
        summary: Test suite for model checking persistent memory programs
    publications:
      - title: 'Dynamic Coalescence for Pay-as-you-go Serverless LLM Inference'
